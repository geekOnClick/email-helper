# FalkorDB для email-helper.
# Поднять: docker compose -f docker/docker-compose.yml up -d
# Пароль читается из .env (FALKORDB_PASSWORD).
services:
  falkordb:
    image: falkordb/falkordb-server:latest
    container_name: email-helper-falkordb
    ports:
      - '${FALKORDB_PORT:-6380}:6379'
    environment:
      # Пароль + персистентность (AOF)
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD:-falkordb} --appendonly yes
      - FALKORDB_ARGS=THREAD_COUNT 4 TIMEOUT_MAX 30000
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${FALKORDB_PASSWORD:-falkordb}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  falkordb_data:
    driver: local